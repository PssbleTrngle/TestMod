name: Trigger Release

on:
  schedule:
    - cron: "30 4 * * 0,3"
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  trigger:
    strategy:
      matrix:
        setup:
          - key: architectury
            version: 1.20.x
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ matrix.setup.key }} ${{ github.run_number }} (${{ matrix.setup.version }})
          tag_name: 1.0.${{ github.run_number }}-${{ matrix.setup.version }}-${{ matrix.setup.key }}
          body: "this is an automatic test release"
          target_commitish: main/${{ matrix.setup.key }}/${{ matrix.setup.version }}
